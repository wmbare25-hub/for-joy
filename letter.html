<!DOCTYPE html>
<html>
<head>
  <title>My Letter For You 💜</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="letter">
  <h1>💌 My Love</h1>

  <p id="typing"></p>

  <h2>Forever yours ❤️</h2>
</div>

<script>
const message = "Every moment with you means more than words can explain. Thank you for bringing happiness, love, and beautiful memories into my life. I hope this little surprise reminds you how much you mean to me. I am grateful for you today, tomorrow, and always. 💜";

let i = 0;

function typeWriter() {
  if (i < message.length) {
    document.getElementById("typing").innerHTML += message.charAt(i);
    i++;
    setTimeout(typeWriter, 50);
  }
}

typeWriter();
</script>

</body>
</html>
